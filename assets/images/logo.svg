    <!-- Right Stem/Leaf (Vibrant Green) -->
    <path d="M26.5 21.5H33.5A 2.5 2.5 0 0 1 36 24.0V27.5A 9.5 9.5 0 0 1 26.5 37.0V21.5Z" fill="#22C55E"/>
    
    <defs>
        <linearGradient id="droplet-grad" x1="25" y1="5" x2="25" y2="45" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4ADE80"/>
            <stop offset="1" stop-color="#15803D"/>
        </linearGradient>
    </defs>
</svg>
