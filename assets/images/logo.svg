<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Droplet background and outline -->
    <path d="M25 5 C 25 15, 40 20, 40 30 A 15 15 0 0 1 10 30 C 10 20, 25 15, 25 5 Z" fill="#F0FDF4" stroke="url(#droplet-grad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Top circle (Sun/Seed) -->
    <circle cx="25" cy="16.5" r="3.5" fill="#84CC16"/>
    
    <!-- Left Stem/Leaf (Dark Green/Navy) -->
